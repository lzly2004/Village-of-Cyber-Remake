# Java 21 defaults to UTF-8, while the Windows launcher reads @argfile paths using
# the native code page. COMPAT keeps Chinese workspace paths loadable on Windows
# and resolves to the native UTF-8 default on modern Unix-like systems.
org.gradle.jvmargs=-Dfile.encoding=COMPAT -Xmx512m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2
org.gradle.parallel=false
org.gradle.workers.max=1
