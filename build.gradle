import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.nio.charset.StandardCharsets
import java.security.MessageDigest

plugins {
    id 'java'
    id 'application'
}

group = 'com.vocr'
version = '1.0.3.4'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

// HTTP 适配器独立编译、运行；不把 Jetty/Javalin 装进桌面 Fat JAR。
sourceSets {
    web {
        java.srcDir 'src/web/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.web.output
        runtimeClasspath += sourceSets.web.output
    }
}

configurations {
    webImplementation.extendsFrom implementation
    webRuntimeOnly.extendsFrom runtimeOnly
    testImplementation.extendsFrom webImplementation
    testRuntimeOnly.extendsFrom webRuntimeOnly
}

dependencies {
    webImplementation 'io.javalin:javalin:7.2.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    testImplementation 'com.tngtech.archunit:archunit:1.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
}

application {
    mainClass = 'com.vocr.app.Game'
}

tasks.register('runWeb', JavaExec) {
    group = 'application'
    description = '启动仅绑定 127.0.0.1 的游客 HTTP API。'
    classpath = sourceSets.web.runtimeClasspath
    mainClass = 'com.vocr.web.GuestGameServer'
    workingDir = rootDir
}

tasks.register('runWebTestServer', JavaExec) {
    group = 'verification'
    description = '仅供浏览器回归使用的固定种子真实 HTTP 服务，不进入生产产物。'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vocr.web.SeededGuestGameServer'
    workingDir = rootDir
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
    workingDir = rootDir
    maxParallelForks = 1
    minHeapSize = '32m'
    maxHeapSize = '256m'
    jvmArgs '-XX:MaxMetaspaceSize=192m', '-XX:ActiveProcessorCount=2'
}

tasks.withType(JavaExec).configureEach {
    maxHeapSize = '256m'
    jvmArgs '-XX:MaxMetaspaceSize=192m', '-XX:ActiveProcessorCount=2'
}

tasks.register('verifyProbabilityConfig') {
    group = 'verification'
    description = '校验唯一概率配置包含全部560种合法组合。'
    inputs.file(layout.projectDirectory.file('config/probability.json'))

    doLast {
        File configFile = layout.projectDirectory.file('config/probability.json').asFile
        def root = new JsonSlurper().parse(configFile)
        if (!(root.probabilities instanceof List)) {
            throw new GradleException("${configFile} 缺少 probabilities 数组")
        }

        List probabilities = root.probabilities as List
        if (probabilities.size() != 560) {
            throw new GradleException("概率配置应有560条，实际为${probabilities.size()}条")
        }

        Set<String> keys = new HashSet<>()
        probabilities.eachWithIndex { entry, index ->
            List<String> required = ['zhi', 'situation', 'p1', 'p2', 'probability']
            if (!required.every { entry.containsKey(it) }) {
                throw new GradleException("概率配置第${index + 1}条缺少必需字段")
            }
            int zhi = entry.zhi as int
            int situation = entry.situation as int
            int p1 = entry.p1 as int
            int p2 = entry.p2 as int
            int probability = entry.probability as int
            if (!(zhi in 0..4) || !(situation in 0..6) || !(p1 in 0..3) || !(p2 in 0..3)) {
                throw new GradleException("概率配置第${index + 1}条参数越界")
            }
            if (!(probability in 0..100)) {
                throw new GradleException("概率配置第${index + 1}条概率不在0..100")
            }
            String key = "${zhi} ${situation} ${p1} ${p2}"
            if (!keys.add(key)) {
                throw new GradleException("概率配置存在重复组合: ${key}")
            }
        }
    }
}

tasks.register('verifyRuntimeAssets') {
    group = 'verification'
    description = '校验全部打包音频已拉取Git LFS且具有合法WAV文件头。'
    inputs.files(fileTree('src/main/resources') { include '**/*.wav' })

    doLast {
        List<File> audioFiles = fileTree('src/main/resources') {
            include 'BGM/*.wav'
            include 'sounds/*.wav'
        }.files.sort { it.path }
        if (audioFiles.isEmpty()) {
            throw new GradleException('没有找到任何待打包的WAV音频')
        }

        List<File> pointers = audioFiles.findAll { file ->
            byte[] prefix = new byte[(int) Math.min(file.length(), 128L)]
            file.withInputStream { stream -> stream.read(prefix) }
            new String(prefix, StandardCharsets.US_ASCII)
                    .startsWith('version https://git-lfs.github.com/spec/v1')
        }.sort { it.path }

        if (!pointers.isEmpty()) {
            String relativeFiles = pointers.collect { rootDir.toPath().relativize(it.toPath()) }.join(', ')
            throw new GradleException("以下音频仍是Git LFS指针，不能打包：${relativeFiles}。请先运行 git lfs pull。")
        }

        List<File> invalidWav = audioFiles.findAll { file ->
            byte[] header = new byte[12]
            int read = file.withInputStream { stream -> stream.read(header) }
            read != 12 || new String(header, 0, 4, StandardCharsets.US_ASCII) != 'RIFF'
                    || new String(header, 8, 4, StandardCharsets.US_ASCII) != 'WAVE'
        }
        if (!invalidWav.isEmpty()) {
            String relativeFiles = invalidWav.collect { rootDir.toPath().relativize(it.toPath()) }.join(', ')
            throw new GradleException("以下必需音频不是有效的RIFF/WAV文件：${relativeFiles}")
        }
    }
}

check.dependsOn tasks.named('verifyProbabilityConfig')

tasks.register('fatJar', Jar) {
    group = 'build'
    description = '生成包含运行依赖的可执行JAR。'
    archiveClassifier = 'all'
    dependsOn check, tasks.named('verifyRuntimeAssets')
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// A distinct server classpath: retain shared code, never desktop media or test classes.
// Dependencies stay in separate JARs so Jetty/service-provider metadata is not flattened.
tasks.register('webServerJar', Jar) {
    group = 'build'
    archiveClassifier = 'web'
    dependsOn tasks.named('classes'), tasks.named('webClasses')
    from sourceSets.main.output.classesDirs
    from sourceSets.web.output.classesDirs
    manifest { attributes 'Main-Class': 'com.vocr.web.GuestGameServer' }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register('prepareWebRuntime', Sync) {
    group = 'build'
    description = '准备独立Web运行classpath；发布入口在完整验证后核对并组包。'
    dependsOn tasks.named('webServerJar')
    into layout.buildDirectory.dir('web-runtime')
    from(tasks.named('webServerJar')) { rename { 'server.jar' } }
    from(configurations.webRuntimeClasspath) { into 'lib' }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    doLast {
        def sha256 = { File f ->
            def digest = MessageDigest.getInstance('SHA-256')
            f.withInputStream { stream ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            digest.digest().encodeHex().toString()
        }
        def capture = new ByteArrayOutputStream()
        exec { commandLine 'git', 'rev-parse', 'HEAD'; standardOutput = capture }
        String head = capture.toString('UTF-8').trim()
        if (!(head ==~ /[0-9a-f]{40}/)) throw new GradleException('Invalid source SHA')
        def sources = fileTree('src/main/java') { include '**/*.java' }.files +
                fileTree('src/web/java') { include '**/*.java' }.files +
                [file('build.gradle'), file('settings.gradle'), file('gradle.properties'), file('config/probability.json')]
        def sourceHashes = sources.sort { it.path }.collectEntries {
            [(rootDir.toPath().relativize(it.toPath()).toString().replace('\\', '/')): sha256(it)]
        }
        File output = layout.buildDirectory.dir('web-runtime').get().asFile
        def jars = fileTree(output) { include '**/*.jar' }.files.sort { it.path }.collectEntries {
            [(output.toPath().relativize(it.toPath()).toString().replace('\\', '/')): sha256(it)]
        }
        new File(output, 'runtime-build.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                schema: 1, sourceSha: head, javaVersion: System.getProperty('java.version'),
                gradleVersion: gradle.gradleVersion, sourceFiles: sourceHashes, files: jars
        ])) + '\n', 'UTF-8')
    }
}

tasks.register('runPackagedWeb', Exec) {
    group = 'verification'
    description = '只在build内运行已校验解包的Web启动脚本，沿现有Linux安全入口调用。'
    doFirst {
        String value = providers.gradleProperty('vocrReleaseDir').orNull
        if (!value) throw new GradleException('vocrReleaseDir is required')
        File release = file(value).canonicalFile
        if (!release.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath()) ||
                !new File(release, 'backend/run.sh').isFile()) {
            throw new GradleException('Packaged verification must use a checked directory inside build')
        }
        workingDir release
        commandLine 'bash', new File(release, 'backend/run.sh').path, '17074'
    }
}

distributions {
    main {
        contents {
            from('config/probability.json') {
                into 'config'
            }
        }
    }
}
